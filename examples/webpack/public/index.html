<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <!-- 内联图标随 HTML 一起输出，让独立示例无需额外的静态文件复制插件。 -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23267a58'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='22' fill='white'%3EW%3C/text%3E%3C/svg%3E"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="独立运行的 Webpack 5 与 Vue 3 单文件组件构建对照实验。" />
        <title><%= htmlWebpackPlugin.options.title %></title>
    </head>
    <body>
        <!-- HtmlWebpackPlugin 以此文件为模板注入 JS 产物；Vue 的入口再挂载到下面的空容器。 -->
        <div id="app"></div>
    </body>
</html>
