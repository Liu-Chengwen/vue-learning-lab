# Vue SPA 与 API 在浏览器中始终同源；后端只接收接口和文档请求。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Docker 内置 DNS。变量代理配合短期DNS缓存，在后端容器重建换IP后重新解析 app。
    # Host 固定来自配置，绝不让请求参数控制上游主机。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $spring_backend http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Session Cookie 默认host-only且Path=/；无需修改Cookie或开放跨域。

    location = /api/v1 {
        proxy_pass $spring_backend$request_uri;
    }
    location ^~ /api/v1/ {
        # request_uri 保留 /api/v1 路径与查询参数，不像 Node Mock 代理剥掉 /api。
        proxy_pass $spring_backend$request_uri;
    }
    location = /backend-health {
        proxy_pass $spring_backend/actuator/health;
    }
    location ^~ /swagger-ui/ {
        proxy_pass $spring_backend$request_uri;
    }
    location = /swagger-ui.html {
        return 302 /swagger-ui/index.html;
    }
    location ^~ /v3/api-docs {
        proxy_pass $spring_backend$request_uri;
    }

    # Node Mock 仅用于开发教学。未知接口不能回退成HTML并伪装成HTTP 200。
    location = /api {
        default_type application/json;
        return 404 '{"status":404,"code":"UNKNOWN_API","message":"Unknown API route","fieldErrors":{}}';
    }
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"status":404,"code":"UNKNOWN_API","message":"Unknown API route","fieldErrors":{}}';
    }

    # 带内容哈希的构建资源可长期缓存；缺失文件直接404，不返回SPA入口。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1h;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        # 项目使用hash路由；保留SPA回退也支持根目录与将来的history模式。
        try_files $uri $uri/ /index.html;
    }
}
